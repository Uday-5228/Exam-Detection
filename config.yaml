streams:
  - id: cam1
    name: "Hall A - Front"
    source: "data/clips/hall_a.mp4"
    loop: true
  - id: cam2
    name: "Hall B"
    source: "data/clips/hall_b.mp4"
    loop: true

model:
  detector: "yolov8n.pt"
  pose: "yolov8n-pose.pt"
  device: "auto"
  imgsz: 640
  conf: 0.35
  keypoint_conf: 0.4
  classes: [0, 67]
  process_every_n_frames: 2

rules:
  peeking:
    yaw_threshold_deg: 35
    sustained_seconds: 3.0
    repeat_turns_count: 3
    repeat_window_seconds: 30
    interruption_tolerance_seconds: 0.5
  device_use:
    min_conf: 0.35
    sustained_seconds: 1.5
    person_bbox_expansion: 0.15
  cooldown_seconds: 10

output:
  jpeg_quality: 70
  stream_width: 640
  annotated_video: "outputs/annotated.mp4"
  snapshot_dir: "data/snapshots"
  event_db: "data/events.db"
  reconnect_seconds: 2.0
  metrics_report: "outputs/metrics_report.md"

demo:
  stream_ids: []
  max_streams: 4
  stream_width: 480
  process_every_n_frames: 3
  probe_frames: 30
  target_fps: 30
  fallback_fps: 25
  recording_seconds: 120
